name: French Flow Daily

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

env:
  FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
  FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
  PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
  ZEN_API_KEY: ${{ secrets.ZEN_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  REMOTION_BROWSER: google-chrome

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg imagemagick fonts-noto
          sudo fc-cache -f

      - uses: browser-actions/setup-chrome@v1

      - name: Install Python deps
        run: pip3 install edge-tts requests

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install npm deps
        run: npm ci

      - name: Run teacher bot
        run: node bot/teacher.js

      - name: Save progress
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main || true
          CHANGED=0
          for f in progress.json idiomes.json culture.json words.json grammar.json verbs.json dialogues.json; do
            F="bot/$f"
            if [ -f "$F" ] && [ -s "$F" ]; then
              git add "$F"
              CHANGED=1
            fi
          done
          if [ "$CHANGED" = "1" ] && ! git diff --cached --quiet; then
            git commit -m "🤖 Update progress $(date +%Y-%m-%d)"
            git push
          else
            echo "No progress files changed"
          fi

