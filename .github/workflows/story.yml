name: French Flow Story

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

env:
  FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
  FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
  PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

jobs:
  story:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto fonts-dejavu
          sudo fc-cache -f

      - name: Install Python deps
        run: pip3 install edge-tts beautifulsoup4 lxml aiohttp requests

      - name: Run storyteller
        run: python3 bot/storyteller.py

      - name: Save story progress
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main || true
          CHANGED=0
          for F in bot/story_progress.json bot/performance_log.json; do
            if [ -f "$F" ] && [ -s "$F" ]; then
              git add "$F"
              CHANGED=1
            fi
          done
          if [ "$CHANGED" = "1" ] && ! git diff --cached --quiet; then
            git commit -m "🤖 Update story progress $(date +%Y-%m-%d)"
            git push
          else
            echo "No story files changed"
          fi
